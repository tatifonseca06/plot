name: plot
services:
  db:
    image: postgres:17-alpine
    env_file: backend/.env
    environment:
      POSTGRES_USER: plot
      POSTGRES_DB: plot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - plot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plot -d plot"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  plot_postgres:
